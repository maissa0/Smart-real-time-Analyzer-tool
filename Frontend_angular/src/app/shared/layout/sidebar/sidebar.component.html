@if (isOpen()) {
  <div class="kpit-overlay" (click)="close()" role="presentation"></div>
}
<nav class="kpit-sidebar" [class.open]="isOpen()">
  <div class="kpit-sidebar-header">
    <span class="kpit-sidebar-brand">KPIT <span>ANALYSER</span></span>
    <button type="button" class="kpit-sidebar-close" (click)="close()" aria-label="Close sidebar">✕</button>
  </div>
  <div class="kpit-nav-links">

    <span class="kpit-nav-section">Workspace</span>

    <a routerLink="/admin" routerLinkActive="kpit-nav-active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>

    <a routerLink="/admin/workspace" routerLinkActive="kpit-nav-active"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      CAN Workspace
    </a>

    <a routerLink="/admin/compare" routerLinkActive="kpit-nav-active"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
        <line x1="2" y1="20" x2="22" y2="20"/>
      </svg>
      Session Compare
    </a>

    <span class="kpit-nav-section">Vehicles &amp; Test Data</span>

    <a routerLink="/admin/fleet" routerLinkActive="kpit-nav-active"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="11" width="22" height="9" rx="2" ry="2"/>
        <path d="M1 11l4-7h14l4 7"/>
        <circle cx="7" cy="20" r="1"/><circle cx="17" cy="20" r="1"/>
      </svg>
      Fleet
    </a>

    <a routerLink="/admin/catalogs" routerLinkActive="kpit-nav-active"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      ECU Catalogs
    </a>

    <a routerLink="/admin/requirements" routerLinkActive="kpit-nav-active"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Requirements
    </a>

    @if (isAdmin()) {
      <span class="kpit-nav-section">Admin</span>

      <a routerLink="/admin/users/list" routerLinkActive="kpit-nav-active"
         class="kpit-nav-item" (click)="close()">
        <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
        Users
      </a>
    }

    <span class="kpit-nav-section">System</span>

    <a routerLink="/admin/settings" routerLinkActive="kpit-nav-active"
       class="kpit-nav-item" (click)="close()">
      <svg class="kpit-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83
          2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33
          1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4
          a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06
          A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09
          A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06
          a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51
          V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33
          l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9
          a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09
          a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      Settings
    </a>

  </div>
</nav>
