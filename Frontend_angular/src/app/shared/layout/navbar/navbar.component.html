<header class="kpit-topbar">
  <div class="kpit-topbar-left">
    <button type="button" class="kpit-hamburger" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <span class="kpit-brand">KPIT <span class="kpit-brand-accent">ANALYSER</span></span>
  </div>
  <div class="kpit-topbar-right flex min-w-0 flex-1 items-center justify-end gap-2">
    <div class="flex min-w-0 max-w-md flex-1 items-center gap-2">
      <div class="kpit-nav-search-wrap">
        <svg
          class="kpit-nav-search-icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="search"
          placeholder="Search..."
          data-global-search
          class="kpit-nav-search-input"
        />
      </div>
      <kbd class="kpit-kbd">Ctrl+K</kbd>
    </div>
    <button type="button" class="kpit-icon-btn" title="Layout">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z"
        />
      </svg>
    </button>
    <button type="button" class="kpit-icon-btn" title="Language">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"
        />
      </svg>
    </button>
    <button type="button" class="kpit-icon-btn relative" title="Notifications">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
        />
      </svg>
      <span class="kpit-notify-dot"></span>
    </button>
    <div class="relative" #profileContainer>
      @if (showProfile()) {
        <div class="kpit-overlay-click" (click)="closeProfile()" aria-hidden="true"></div>
      }
      <button
        type="button"
        (click)="toggleProfile(); $event.stopPropagation()"
        class="kpit-avatar-btn"
      >
      <div class="kpit-avatar-circle" style="overflow:hidden;">
        @if (authStore.user()?.avatarUrl) {
          <img [src]="authStore.user()?.avatarUrl"
            style="width:100%; height:100%; object-fit:cover; border-radius:50%;"
            alt="avatar"/>
        } @else {
          <span>{{ initials() }}</span>
        }
      </div>
      </button>
      @if (showProfile()) {
        <div class="kpit-dropdown" (click)="$event.stopPropagation()">
          <div class="kpit-dropdown-header">
            <p class="kpit-dropdown-name">{{ authStore.user()?.fullName ?? 'User' }}</p>
            <p class="kpit-dropdown-role">UI/UX Designer</p>
          </div>
          <div class="py-1">
            <a routerLink="/admin/profile" (click)="closeProfile()" class="kpit-dropdown-link"> Profile </a>
          </div>
          <div class="border-t border-able-border pt-1" style="border-color: rgba(176, 255, 68, 0.12)">
            <button type="button" (click)="onLogout()" class="kpit-dropdown-logout">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                />
              </svg>
              Logout
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
