<div style="position:fixed; inset:0; z-index:50; overflow:hidden;">
  <div style="position:absolute; inset:0; background:rgba(0,0,0,0.6);" (click)="onClose()"></div>
  <div style="
    position:absolute; right:0; top:0;
    height:100%; width:100%; max-width:420px;
    background:#0d1117;
    border-left:1px solid rgba(176,255,68,0.15);
    display:flex; flex-direction:column;">

    <!-- Header -->
    <div style="
      display:flex; align-items:center; justify-content:space-between;
      padding:1.25rem 1.5rem;
      border-bottom:1px solid rgba(176,255,68,0.1);">
      <div>
        <h2 style="font-size:1rem; font-weight:700; color:#fff; margin:0 0 0.2rem;">Edit User</h2>
        <p style="font-size:0.72rem; color:#8a9ab0; margin:0;">
          Only Job Title and Department are editable
        </p>
      </div>
      <button type="button" (click)="onClose()"
        style="background:none; border:none; color:#8a9ab0; cursor:pointer; font-size:1.1rem; padding:4px 8px;">✕</button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()"
      style="flex:1; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; gap:1.25rem;">

      <!-- Avatar + name -->
      <div style="display:flex; align-items:center; gap:1rem; padding-bottom:1.25rem; border-bottom:1px solid #21262d;">
        <div style="
          width:48px; height:48px; border-radius:50%; flex-shrink:0;
          background:rgba(176,255,68,0.15); border:1px solid rgba(176,255,68,0.3);
          display:flex; align-items:center; justify-content:center;
          font-size:1.1rem; font-weight:700; color:#b0ff44;">
          {{ user().fullName?.charAt(0)?.toUpperCase() ?? 'U' }}
        </div>
        <div>
          <p style="font-size:0.95rem; font-weight:600; color:#e6edf3; margin:0 0 0.2rem;">
            {{ user().fullName }}
          </p>
          <p style="font-size:0.75rem; color:#8a9ab0; margin:0;">{{ user().email }}</p>
        </div>
      </div>

      <!-- Read-only fields -->
      <div>
        <p style="font-size:0.65rem; font-weight:700; color:#484f58; letter-spacing:0.12em; margin:0 0 0.75rem;">
          USER INFORMATION
        </p>

        <div style="display:flex; flex-direction:column; gap:0.75rem;">

          <!-- Full Name — read only -->
          <div>
            <label style="display:block; font-size:0.72rem; color:#8a9ab0; margin-bottom:0.3rem;">Full Name</label>
            <p style="
              background:#161b22; border:1px solid #21262d; border-radius:6px;
              padding:8px 12px; font-size:0.82rem; color:#8a9ab0; margin:0;">
              {{ user().fullName ?? '—' }}
            </p>
          </div>

          <!-- Phone — read only -->
          <div>
            <label style="display:block; font-size:0.72rem; color:#8a9ab0; margin-bottom:0.3rem;">Phone</label>
            <p style="
              background:#161b22; border:1px solid #21262d; border-radius:6px;
              padding:8px 12px; font-size:0.82rem; color:#8a9ab0; margin:0;">
              {{ user().phone ?? '—' }}
            </p>
          </div>
        </div>
      </div>

      <!-- Editable fields -->
      <div>
        <p style="font-size:0.65rem; font-weight:700; color:#b0ff44; letter-spacing:0.12em; margin:0 0 0.75rem;">
          EDITABLE BY ADMIN
        </p>

        <div style="display:flex; flex-direction:column; gap:0.75rem;">

          <!-- Job Title — editable -->
          <div>
            <label style="display:block; font-size:0.72rem; font-weight:600; color:#e6edf3; margin-bottom:0.3rem;">
              Job Title
            </label>
            <input type="text" formControlName="jobTitle"
              placeholder="e.g. CAN Engineer"
              style="
                width:100%; background:#161b22;
                border:1px solid rgba(176,255,68,0.25);
                border-radius:6px; color:#e6edf3; font-size:0.82rem;
                padding:8px 12px; outline:none; box-sizing:border-box;"/>
          </div>

          <!-- Department — editable -->
          <div>
            <label style="display:block; font-size:0.72rem; font-weight:600; color:#e6edf3; margin-bottom:0.3rem;">
              Department
            </label>
            <input type="text" formControlName="department"
              placeholder="e.g. R&D, Powertrain"
              style="
                width:100%; background:#161b22;
                border:1px solid rgba(176,255,68,0.25);
                border-radius:6px; color:#e6edf3; font-size:0.82rem;
                padding:8px 12px; outline:none; box-sizing:border-box;"/>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div style="margin-top:auto; padding-top:1rem; border-top:1px solid #21262d; display:flex; gap:0.75rem;">
        <button type="button" (click)="onClose()"
          style="
            flex:1; background:transparent; border:1px solid #30363d;
            color:#8a9ab0; border-radius:8px; padding:9px;
            font-size:0.82rem; cursor:pointer;">
          Cancel
        </button>
        <button type="submit" [disabled]="form.invalid || isSaving()"
          style="
            flex:1; background:#b0ff44; color:#07090b;
            border:none; border-radius:8px; padding:9px;
            font-size:0.82rem; font-weight:700; cursor:pointer;"
          [style.opacity]="isSaving() ? '0.5' : '1'">
          {{ isSaving() ? 'Saving…' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
