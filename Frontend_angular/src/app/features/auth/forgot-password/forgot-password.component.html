<div class="auth-page-bg px-4">
  <div class="w-full max-w-md">
    <div class="auth-card p-8 shadow-able-card">
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold" style="color: #b0ff44">
          KPIT <span class="text-sm align-super" style="color: #fff">Analyser</span>
        </h1>
      </div>
      @if (submitted()) {
        <div class="text-center">
          <div
            class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full"
            style="background: rgba(176, 255, 68, 0.15)"
          >
            <svg class="h-8 w-8" style="color: #b0ff44" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
          </div>
          <h2 class="mb-2 text-xl font-semibold text-white">Check Your Mail</h2>
          <p class="mb-6 text-sm" style="color: #8a9ab0">We have sent a password recovery link to your email.</p>
          <button
            type="button"
            routerLink="/auth/login"
            class="auth-btn-primary rounded-lg px-6 py-2.5 font-medium"
          >
            Back to Login
          </button>
        </div>
      } @else {
        <h2 class="mb-6 text-xl font-semibold text-white">Forgot Password?</h2>
        <p class="mb-6 text-sm" style="color: #8a9ab0">Enter your email and we'll send you a reset link.</p>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-6">
            <label class="mb-1 block text-sm font-medium" style="color: #d0d6e0">Email</label>
            <input
              formControlName="email"
              type="email"
              class="auth-input w-full px-3 py-2 text-sm"
              placeholder="you@example.com"
            />
          </div>
          <button type="submit" [disabled]="form.invalid" class="auth-btn-primary w-full px-4 py-2.5 font-medium">
            Send Reset Link
          </button>
        </form>
        <p class="mt-6 text-center text-sm" style="color: #8a9ab0">
          <a routerLink="/auth/login" class="auth-link font-medium">Back to Login</a>
        </p>
      }
    </div>
  </div>
</div>
