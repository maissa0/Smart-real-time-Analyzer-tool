<div class="auth-page-bg px-4">
  <div class="w-full max-w-md">
    <div class="auth-card p-8 shadow-able-card">
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold" style="color: #b0ff44">
          KPIT <span class="text-sm align-super" style="color: #fff">Analyser</span>
        </h1>
      </div>
      <h2 class="mb-6 text-xl font-semibold text-white">Reset Password</h2>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="mb-1 block text-sm font-medium" style="color: #d0d6e0">New Password</label>
          <input
            formControlName="password"
            type="password"
            class="auth-input w-full px-3 py-2 text-sm"
            placeholder="••••••••"
          />
        </div>
        <div class="mb-6">
          <label class="mb-1 block text-sm font-medium" style="color: #d0d6e0">Confirm Password</label>
          <input
            formControlName="confirmPassword"
            type="password"
            class="auth-input w-full px-3 py-2 text-sm"
            placeholder="••••••••"
          />
        </div>
        <button type="submit" [disabled]="form.invalid" class="auth-btn-primary w-full px-4 py-2.5 font-medium">
          Reset Password
        </button>
      </form>
      <p class="mt-6 text-center text-sm" style="color: #8a9ab0">
        <a routerLink="/auth/login" class="auth-link font-medium">Back to Login</a>
      </p>
    </div>
  </div>
</div>
