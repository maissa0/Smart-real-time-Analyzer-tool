spring.config.import=optional:classpath:application-secrets.properties
spring.application.name=KPIT Smart CAN Analyser
# MySQL - Set DB_PASSWORD env var in production, or override below for local dev
spring.datasource.url=jdbc:mysql://localhost:3306/smart_real_time_analyser?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT - Use JWT_SECRET in production (min 32 chars)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.reset-token-expiration-ms=900000
app.jwt.mfa-auth-token-expiration-ms=300000

# Server
server.port=8080

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Storage: local (default) or s3
app.storage.type=${STORAGE_TYPE:local}
app.upload.dir=C:/tools/Kpit_c/uploads/avatars
app.base-url=http://localhost:8080

# S3 (when app.storage.type=s3)
app.storage.s3.bucket=${S3_BUCKET:able-pro-iam-avatars}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${S3_SECRET:}
app.storage.s3.prefix=avatars
app.storage.s3.public-url=

# Mail (Mailtrap SMTP - use env vars in production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:kpit.analyser@gmail.com}
app.mail.from-name=KPIT Smart CAN Analyser

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kpit-backend
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# InfluxDB
influxdb.url=http://localhost:8086
influxdb.token=${INFLUXDB_TOKEN}
influxdb.org=kpit
influxdb.bucket=ecu_telemetry

# WebSocket
spring.websocket.path=/ws-ecu-gateway

# Python pipeline
pipeline.uploads.dir=C:/tools/Kpit_c/uploads
pipeline.catalogues.dir=C:/tools/Kpit_c/python_parser/catalogues
simulator.logs.dir=C:/tools/Kpit_c/uploads

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CAN catalog files
catalog.path=C:/tools/Kpit_c/python_parser/catalogues
