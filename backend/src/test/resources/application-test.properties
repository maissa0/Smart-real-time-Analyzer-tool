# ─── Test profile ─────────────────────────────────────────────────────────────
# H2 in-memory database — no MySQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use none — schema is created by schema.sql in test resources
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=test-secret-key-for-unit-tests-minimum-32-chars-long
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.reset-token-expiration-ms=900000
app.jwt.mfa-auth-token-expiration-ms=300000

# Mail — keep auto-config active, point to nowhere
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# Kafka — exclude only Kafka
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# InfluxDB placeholder
influxdb.url=http://localhost:8086
influxdb.token=test-token
influxdb.org=test
influxdb.bucket=test

# Storage
app.storage.type=local
app.upload.dir=uploads/avatars
app.base-url=http://localhost:8080

# Suppress secrets file import warning
spring.config.import=
