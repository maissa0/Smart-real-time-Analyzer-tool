<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <h1 class="auth-title">CREATE ACCOUNT</h1>
        <div class="auth-subtitle">Join the Network Intelligence Platform</div>
      </div>

      <div *ngIf="error" class="auth-error">
        {{ error }}
      </div>
      
      <div *ngIf="success" class="auth-success">
        {{ success }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              class="form-input" 
              [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched"
              formControlName="username" 
              placeholder="operator_id"
              autocomplete="username">
          </div>
          <span class="validation-error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
            Username is required
          </span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
              formControlName="email" 
              placeholder="operator@company.com"
              autocomplete="email">
          </div>
          <span class="validation-error" *ngIf="form.get('email')?.errors?.['required'] && form.get('email')?.touched">
            Email is required
          </span>
          <span class="validation-error" *ngIf="form.get('email')?.errors?.['email'] && form.get('email')?.touched">
            Please enter a valid email address
          </span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              class="form-input"
              [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched" 
              formControlName="password" 
              placeholder="••••••••"
              autocomplete="new-password">
            <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="validation-hint" [class.is-valid]="form.get('password')?.value?.length >= 8">
            Minimum 8 characters required
          </span>
          <span class="validation-error" *ngIf="form.get('password')?.errors?.['required'] && form.get('password')?.touched">
            Password is required
          </span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading || success !== ''">
          <span *ngIf="!loading">REGISTER</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <div class="auth-footer">
          <a routerLink="/login" class="auth-link">Already have an account? Sign in</a>
        </div>
      </form>
    </div>
  </div>
</div>
