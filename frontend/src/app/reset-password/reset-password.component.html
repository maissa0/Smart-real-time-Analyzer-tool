<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <h1 class="auth-title">
          SMART <span class="auth-title-accent">ANALYSER</span>
        </h1>
        <div class="auth-subtitle">Reset Password</div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              class="form-input"
              [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
              formControlName="email"
              placeholder="you@example.com"
              autocomplete="email">
          </div>
          <span class="validation-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            A valid email is required
          </span>
        </div>

        <!-- OTP code -->
        <div class="form-group">
          <label class="form-label" for="otp">6-digit code</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              type="text"
              id="otp"
              class="form-input otp-input"
              [class.is-invalid]="form.get('otp')?.invalid && form.get('otp')?.touched"
              formControlName="otp"
              placeholder="123456"
              maxlength="6"
              autocomplete="one-time-code">
          </div>
          <span class="validation-error" *ngIf="form.get('otp')?.invalid && form.get('otp')?.touched">
            Enter the 6-digit code from your email
          </span>
        </div>

        <!-- New password -->
        <div class="form-group">
          <label class="form-label" for="newPassword">New password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="newPassword"
              class="form-input"
              [class.is-invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
              formControlName="newPassword"
              placeholder="••••••••"
              autocomplete="new-password">
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword" tabindex="-1">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94
                         M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19
                         m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="validation-error" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
            Password must be at least 6 characters
          </span>
        </div>

        <!-- Confirm password -->
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              [type]="showConfirm ? 'text' : 'password'"
              id="confirmPassword"
              class="form-input"
              [class.is-invalid]="(form.get('confirmPassword')?.touched && form.errors?.['mismatch'])"
              formControlName="confirmPassword"
              placeholder="••••••••"
              autocomplete="new-password">
            <button type="button" class="toggle-password" (click)="showConfirm = !showConfirm" tabindex="-1">
              <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94
                         M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19
                         m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="validation-error"
                *ngIf="form.get('confirmPassword')?.touched && form.errors?.['mismatch']">
            Passwords do not match
          </span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
          <span *ngIf="!loading">RESET PASSWORD</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <div class="auth-footer">
          <a routerLink="/forgot-password" class="auth-link">Resend code</a>
          &nbsp;·&nbsp;
          <a routerLink="/login" class="auth-link">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>
</div>
