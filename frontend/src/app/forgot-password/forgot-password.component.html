<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <h1 class="auth-title">
          SMART <span class="auth-title-accent">ANALYSER</span>
        </h1>
        <div class="auth-subtitle">Password Recovery</div>
      </div>

      <div *ngIf="submitted" class="success-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
             fill="none" stroke="#b0ff44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13
                   19.79 19.79 0 0 1 1.61 4.27 2 2 0 0 1 3.58 2h3a2 2 0 0 1 2 1.72c.127.96.361
                   1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.17 6.17l.93-.94a2 2
                   0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <p>Check your email for a reset code.<br>
           <span class="hint">Then go to <a routerLink="/reset-password" class="auth-link">Reset Password</a>.</span>
        </p>
      </div>

      <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              class="form-input"
              [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
              formControlName="email"
              placeholder="you@example.com"
              autocomplete="email">
          </div>
          <span class="validation-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            A valid email is required
          </span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="form.invalid || loading">
          <span *ngIf="!loading">SEND RESET CODE</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <div class="auth-footer">
          <a routerLink="/login" class="auth-link">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>
</div>
