spring.application.name=smart-analyzer-backend
server.port=8082
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/smart_analyzer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123mallajaw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT (use a strong secret in production; HS256 needs >= 256 bits)
jwt.secret=ChangeMeToAVeryLongSecretKeyAtLeast32BytesLongForHS256Algorithm
jwt.expiration-ms=86400000

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Avatars upload directory (relative to repo root)
avatars.upload-dir=uploads/avatars

# DevTools — disable automatic restart (prevents periodic restarts on file changes)
spring.devtools.restart.enabled=false

# Simulator XML definitions directory (relative to smart-analyzer-backend/ working dir)
simulator.definitions-dir=../python_parser

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=can-analyzer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
